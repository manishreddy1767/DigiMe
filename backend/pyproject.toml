[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-me-foundation"
version = "0.1.0"
description = "Local-first Digital Me application foundation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
feasibility = [
    "av>=11,<19",
    "faster-whisper>=1.1,<2",
    "kokoro>=0.9.4,<1",
    "soundfile>=0.13,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]
